[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
compute-proto = { path = "crates/proto" }
compute-net = { path = "crates/net" }
compute-sim = { path = "crates/sim" }
compute-coordinator = { path = "crates/coordinator" }
compute-agent = { path = "crates/agent" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
fs4 = "1"
iroh = "1.3"
postcard = { version = "1", features = ["use-std"] }
rand = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
