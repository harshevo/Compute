[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compute-sdk"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["safetensors>=0.4", "numpy>=1.26", "blake3>=1", "psutil>=5.9"]

[project.optional-dependencies]
train = ["torch>=2.5"]
directml = ["torch-directml; sys_platform == 'win32'"]
controls = ["psutil>=5.9"]
inference = ["openvino>=2025.0"]
gateway = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
compute-python = "compute_sdk.cli:main"

[tool.setuptools.packages.find]
include = ["compute_sdk*"]
